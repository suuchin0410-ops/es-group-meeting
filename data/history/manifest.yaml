# ============================================================
# 補助データソース（過年度の月次実績）
# ============================================================
#
# 標準の月次Excel（data/monthly/{prefix}-YYYYMM.xlsx）は1事業年度分しか
# 持たないため、連結で過年度が必要な場合にここで補う。
#
# 特にライフワークは3月決算（期首4月）で、エンタ・エスクリエイト（6月決算）と
# 事業年度がずれる。暦月ベースで12ヶ月を連結するには、LWの前年度実績が要る。
#
# rows は「列Bのラベル → 内部項目名」の対応。行番号ではなくラベルで拾うため、
# 行の増減に強い。
#
# ============================================================

sources:
  - company: life-work
    file: LW-予測PL-202504-202603.xlsx
    sheet: 予測PL (2025.04-)
    unit: 円                    # 標準の月次Excel(千円)と異なるので変換する
    first_month: "202504"       # 最初の月次列が指す暦月
    month_count: 12
    first_col: 2                # 月次列の開始インデックス（0始まり）。以降1列ずつ
    rows:
      売上高: 売上
      売上原価: 売上原価
      粗利益: 売上総利益
      販管費: 販売管理費合計
      営業利益: 営業利益
      経常利益: 経常利益
    note: |
      ライフワークの2025年度（2025/4〜2026/3）月次実績。
      シート名は「予測PL」だが列見出しは「n月実績」で、12ヶ月すべて実績が入っている。
      年間累計: 売上 50,493千円 / 営業利益 ▲3,951千円 / 経常利益 ▲2,305千円。
      標準様式の LW-月次検証-202603.xlsx が入手できれば、そちらに差し替えてよい。
