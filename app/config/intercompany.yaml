# ============================================================
# esグループ 内部取引（グループ間取引）の定義
# ============================================================
#
# ■ なぜこのファイルが必要か
#
# 各社の月次Excelには「取引相手が誰か」の情報が一切ない。
#   - 売上はセグメント別（恵愛/村/弁当/シェア/サウナ、国保連A型/B型/生産活動 等）
#   - 費用は勘定科目別
#   - エンタに至っては業務委託費が人件費に合算されている（月次PL推移）
#
# そのため「どの売上がグループ内向けか」を機械的に判定できない。
# 消去すべき内部取引はこのファイルで人間が宣言する。
#
# ■ status の意味
#
#   confirmed   : 金額が確定している。連結時に消去する
#   provisional : 暫定値。消去するが、ダッシュボードに「暫定」と表示される
#   unknown     : 金額が未把握。消去せず「未確認」として警告に出す
#
# 推定値を confirmed に入れないこと。連結売上が実態より小さく見えてしまう。
#
# ■ amounts の書き方
#
#   amounts:
#     "202604": 1200      # 暦月(YYYYMM)をキーに、その月の取引額（千円）
#     "202605": 1000
#
# 記載のない月はゼロとして扱う。
#
# ============================================================

meta:
  basis: 暦月（YYYYMM）
  unit: 千円
  privacy: |
    本ファイルは公開リポジトリに含まれるため、取引先名・個人名は記載しない。
    グループ外の相手方は「関連会社A/B」等の符号で表す。
    詳細な経緯は議事録（Notion / docs/meeting-notes/）を参照すること。
  note: |
    決算期が揃っていないため（エンタ・SC=6月決算 / LW=3月決算）、
    連結は暦月ベースで行う。3社すべてのデータが揃う月のみ連結値として有効。

# ------------------------------------------------------------
# 損益の内部取引（売上と費用を同額消去する）
# ------------------------------------------------------------
transactions:

  - id: lw-seisan-to-ent
    name: LW生産活動 → エンタ（弁当業務・サウナ清掃等の業務委託）
    seller: life-work
    seller_segment: 生産活動
    buyer: es-entertainment
    buyer_account: 人件費        # エンタ月次では業務委託費が人件費に合算されている
    status: unknown
    amounts: {}
    evidence: |
      2026-07-16 議事録：エンタの計画値には「ライフワークのお弁当業務や
      サウナ清掃などの業務委託費」が含まれると明言されている。
      LWの「生産活動」売上は 202604:3,037 / 202605:1,000 / 202606:1,514 千円。
      エンタの決算書上の業務委託費は通年 4,189 千円。
    to_confirm: |
      LWの生産活動売上のうち、エンタ向けはいくらか（月別）。
      生産活動には外部向けの請負も含まれる可能性があるため、全額ではないはず。

  - id: sc-to-lw-consulting
    name: SC → LW（コンサルティング／業務委託）
    seller: s-create
    seller_segment: 売上高
    buyer: life-work
    buyer_account: 販管費
    status: unknown
    amounts: {}
    evidence: |
      2026-07-16 議事録：「SCの6月売上はライフワーク社からの貢献もあり」。
      SC 売掛金 8,977千円（202606）と LW 未払金 9,886千円（202606）が近い。
      2026-08-17 議事録：LWが7月にエスクリエイトへ197万円支払（未払解消）。
      SC通年売上 8,069千円に対し売掛金 8,977千円＝回収サイト約13.4ヶ月。
    to_confirm: |
      SCの売上8,069千円のうち、LW向けはいくらか（月別）。
      売掛金8,977千円の相手先内訳もあわせて確認したい。

  - id: ent-utilities-to-lw
    name: エンタ → LW（水道光熱費の負担分）
    seller: es-entertainment
    seller_segment: 雑収入        # 経費戻し処理の場合は売上ではなく費用のマイナス
    buyer: life-work
    buyer_account: 水道光熱費
    status: unknown
    amounts: {}
    evidence: |
      2026-08-17 議事録：ライフワークからの負担金 約50万円を受領済み。
      さらに未払い約50万円を決算で相殺検討。
      LW側は「外部負担分（ライフワーク負担 約15万円）」の扱いで数値が変動。
    to_confirm: |
      経費戻し（費用のマイナス）と雑収入計上のどちらで処理するか未決。
      2026-08-17 アクション#10「計上方法を統一し最新月次へ反映」（担当:高橋さん）の結果待ち。
      処理方法が決まるまで消去対象にできない。

  - id: lw-to-affiliate-referral
    name: LW → 関連会社A（案件紹介料）
    seller: life-work
    seller_segment: 生産活動
    buyer: affiliate-a
    buyer_account: 業務委託費
    status: unknown
    active: false                # 関連会社Aは連結対象外のため、当面は消去しない
    amounts:
      "202606": 596
    evidence: 2026-08-17 議事録を参照（Notion / docs/meeting-notes/2026-08-17.md）
    to_confirm: |
      関連会社Aは companies.yaml に未登録で、月次データも無い。
      連結対象に含めるかどうかの方針決定が必要。含めるなら月次Excelの提供も要る。

# ------------------------------------------------------------
# 貸借の内部取引（債権と債務を相殺する）
# ------------------------------------------------------------
balances:

  - id: sc-receivable-from-lw
    name: SC売掛金 ⇔ LW未払金
    creditor: s-create
    creditor_account: 売掛金
    debtor: life-work
    debtor_account: 未払金
    status: unknown
    amounts: {}
    evidence: |
      202606: SC売掛金 8,977千円 / LW未払金 9,886千円
      202607: SC売掛金 7,937千円 / LW未払金 9,740千円
    to_confirm: SC売掛金のうちLW向けの金額。差額の中身。

  - id: sc-loan-to-affiliate
    name: SC → 関連会社B 貸付金
    creditor: s-create
    creditor_account: 短期貸付金
    debtor: affiliate-b
    debtor_account: 借入金
    status: unknown
    amounts:
      "202506": 7300
    evidence: |
      SC 短期貸付金 7,300千円（前期末）→ 当期末 0。
      現金は+1,783千円しか増えておらず、売掛金が+6,138千円増えているため、
      回収ではなく売掛金への振替の可能性がある。
      貸付金利息の利率について 2026-08-17 議事録で論点化されている。
    to_confirm: |
      7,300千円がどう消えたのか（回収か振替か）。相手先。
      関連会社Bは連結対象か。認定利息の計算結果。
